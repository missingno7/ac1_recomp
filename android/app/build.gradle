plugins { id 'com.android.application' }

android {
    namespace 'org.ac1.recomp'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.ac1.recomp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DAC1_NATIVE_BINK=ON',
                    '-DAC1_DIRECT_MEMORY=ON', '-DAC1_FORCE_INLINE_ACCESSORS=ON' }
        }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
